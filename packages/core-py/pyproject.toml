[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-md-sync"
version = "0.1.0"
description = "Bidirectional SQLite <-> Markdown sync (Python port)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jindřich Regál", email = "jindrich.regal@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Development Status :: 3 - Alpha",
]
dependencies = []

[project.scripts]
sql-md-sync = "sql_md_sync.cli:main"

[project.urls]
Homepage = "https://github.com/jindraregal/sql-md-sync"
Issues = "https://github.com/jindraregal/sql-md-sync/issues"

[tool.setuptools.packages.find]
where = ["src"]
